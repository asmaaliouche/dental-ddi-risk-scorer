[tool.poetry]
name = "dental-ddi-risk-scorer"
version = "0.1.0"
description = "Drug-drug interaction risk scorer for dental prescribers"
authors = []
readme = "README.md"
packages = [{ include = "ddi_scorer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2"
numpy = "^1.26"
scikit-learn = "^1.4"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.29" }
pydantic = "^2.7"
python-dotenv = "^1.0"
httpx = "^0.27"
pyarrow = "^25.0.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.1"
ipykernel = "^6.29"
pytest = "^8.2"
pytest-asyncio = "^0.23"
black = "^24.4"
isort = "^5.13"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
